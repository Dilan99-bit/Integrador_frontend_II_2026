<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CESDE - Registro de Empresas</title>
    <link rel="stylesheet" href="Style.css">
</head>
<body>
    <div class="container">
        <!--Formulario -->
        <div class="form-section">
            <div class="logo">
                <!--logo -->
                <h1><span>E-</span>CESDE</h1>
            </div>
            
            <div class="form-content">
                <h2>Registro de Empresas</h2>
                <p class="subtitle">Ingresa el nombre de tu empresa y crea una clave para enviarnos tus proyectos reales.</p>
                
                <form action="#">
                    <div class="input-group">
                        <input type="text" id="nombre_empresa" placeholder="Nombre de la empresa" required>
                    </div>
                    
                    <div class="input-group">
                        <input type="password" id="clave_empresa" placeholder="Crea tu clave" required>
                    </div>
                    
                    <button type="submit" class="btn-registrar">Registrar</button>
                </form>
                
                <p class="footer-text">Bienvenidos grupos Empresariales</p>
            </div>
        </div>
        
        <!-- imagen -->
        <div class="image-section">
            <!-- contenedor -->
            <div class="illustration-placeholder">
                <img src="img/cesde.img.png" alt="Edificio CESDE">
            </div>
        </div>
    </div>
</body>
</html>
